<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechPulse Pro</title>
    <style>
        :root { --bg-main: #f5f5f7; --card-bg: #ffffff; --text-dark: #1d1d1f; --accent-blue: #0066cc; --border-line: #e5e5ea; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-main); padding-top: 80px; margin: 0; }
        
        /* Navbar */
        .navbar { position: fixed; top: 0; width: 100%; background: #ffffff; padding: 15px 20px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-line); z-index: 1000; }
        .nav-link { text-decoration: none; color: var(--text-dark); font-size: 20px; }
        
        /* Panels */
        .panel { position: fixed; top: 0; bottom: 0; width: 280px; background: #ffffff; padding: 20px; z-index: 2000; transition: transform 0.3s ease; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .side-panel { left: 0; transform: translateX(-100%); }
        .right-panel { right: 0; transform: translateX(100%); }
        
        /* Logic: Using IDs to toggle panels */
        #menu-panel:target { transform: translateX(0); }
        #account-panel:target { transform: translateX(0); }
        #cart-panel:target { transform: translateY(0); }
        
        .cart-sheet { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; padding: 20px; border-radius: 20px 20px 0 0; z-index: 2000; transform: translateY(100%); transition: transform 0.3s ease; }
        
        .product-card { background: var(--card-bg); margin: 20px; padding: 20px; border-radius: 20px; }
        .cta-btn { background: var(--text-dark); color: white; padding: 15px; border-radius: 10px; width: 100%; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div id="menu-panel" class="panel side-panel">
        <h3>Menu</h3>
        <a href="#">Close</a>
        <ul style="list-style: none; margin-top: 20px;">
            <li>Home</li>
            <li>Products</li>
            <li>Support</li>
        </ul>
    </div>

    <div id="account-panel" class="panel right-panel">
        <h3>Account</h3>
        <a href="#">Close</a>
        <p>Please log in to continue.</p>
    </div>

    <div class="navbar">
        <a href="#menu-panel" class="nav-link">☰</a>
        <strong>TECHPULSE</strong>
        <div>
            <a href="#account-panel" class="nav-link">👤</a>
            <a href="#cart-panel" class="nav-link">🛒</a>
        </div>
    </div>

    <div class="product-card">
        <h2>PulseCharge 30W</h2>
        <button class="cta-btn" onclick="addToCart('PulseCharge 30W', 39)">Add to Cart — $39</button>
    </div>

    <div class="product-card">
        <h2>PulseBook Pro 16"</h2>
        <button class="cta-btn" onclick="addToCart('PulseBook Pro 16', 1899)">Add to Cart — $1899</button>
    </div>

    <div id="cart-panel" class="cart-sheet">
        <div style="display:flex; justify-content:space-between;">
            <h3>Your Cart</h3>
            <a href="#">Close</a>
        </div>
        <div id="cartItemsList">Empty</div>
        <div id="totalAmount">Total: $0</div>
    </div>

    <script>
        let cart = {};
        function addToCart(name, price) {
            if(cart[name]) cart[name].qty++;
            else cart[name] = {price: price, qty: 1};
            renderCart();
            window.location.hash = 'cart-panel';
        }
        function renderCart() {
            let list = document.getElementById('cartItemsList');
            let total = 0, html = '';
            for(let name in cart) {
                html += `<div>${name} x ${cart[name].qty}</div>`;
                total += cart[name].price * cart[name].qty;
            }
            list.innerHTML = html;
            document.getElementById('totalAmount').innerText = 'Total: $' + total;
        }
    </script>
</body>
</html>
